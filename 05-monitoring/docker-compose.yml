services:
  bootstrap:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    working_dir: /workspace
    command: sh -c "apk add --no-cache make && make deps"

  streamlit:
    build:
      context: ..
      dockerfile: 05-monitoring/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: course-assistant-pg
    ports:
      - '8501:8501'
    networks:
      - monitoring
    depends_on:
      bootstrap:
        condition: service_completed_successfully

networks:
  monitoring:
    external: true
